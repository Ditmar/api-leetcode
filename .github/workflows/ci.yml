name: CI
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
jobs:
  test-submissions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run submissions tests
        run: node --test -r ts-node/register/transpile-only src/submissions/tests/submission-use-cases.test.ts
      - name: Run submissions linter
        run: npx eslint "src/submissions/**/*.ts"
  build-and-push:
    needs: test-submissions
    if: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Get package json version
        run: echo "VERSION=$(node -p -e "require('./package.json').version")" >> $GITHUB_ENV
      - name: Set image tag
        run: echo "IMAGE_TAG=${VERSION}-$(echo ${GITHUB_SHA} | cut -c1-12)" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ditmar/api-leetcode:${{ env.IMAGE_TAG }}